    <style>
        /* Reset & Base */

<body>

    <!-- ロビー画面 -->

    <script src="https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js"></script>
    <script>
        // WebRTC Config (PeerJS)
        let peer = null;
        let dataConnection = null;
        let isHost = false;

        // UI Elements
        const lobbyScreen = document.getElementById('lobbyScreen');
        const battleScreen = document.getElementById('battleScreen');
        const statusText = document.getElementById('statusText');
        const createRoomBtn = document.getElementById('createRoomBtn');
        const inviteArea = document.getElementById('inviteArea');
        const inviteUrlInput = document.getElementById('inviteUrl');
        const copyUrlBtn = document.getElementById('copyUrlBtn');
        const returnLobbyBtn = document.getElementById('returnLobbyBtn');
        const resultScreen = document.getElementById('resultScreen');
        const resultTitle = document.getElementById('resultTitle');

        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const roomIdFromUrl = urlParams.get('room');

            if (roomIdFromUrl) {
                // URLに部屋IDが含まれている場合（ゲスト参加）
                document.getElementById('hostUI').classList.add('hidden');
                statusText.innerText = "ホストに接続しています...";
                joinRoom(roomIdFromUrl);
            } else {
                // 通常アクセス（ホストとして部屋作成）
                createRoomBtn.addEventListener('click', () => {
                    createRoomBtn.disabled = true;
                    statusText.innerText = "部屋を作成中...";
                    createRoom();
                });
            }
        });

        function createRoom() {
            isHost = true;
            // PeerJSを利用してパブリックシグナリングサーバーに接続
            peer = new Peer(); 

            peer.on('open', (id) => {
                // 招待URLを生成して表示
                const inviteLink = window.location.origin + window.location.pathname + '?room=' + id;
                inviteUrlInput.value = inviteLink;
                
                document.getElementById('hostUI').classList.add('hidden');
                inviteArea.classList.remove('hidden');

                copyUrlBtn.onclick = () => {
                    inviteUrlInput.select();
                    document.execCommand('copy');
                    copyUrlBtn.innerText = "コピーしました！";
                    setTimeout(() => copyUrlBtn.innerText = "URLをコピー", 2000);
                };

                statusText.innerText = "対戦相手の参加を待っています...";
            });

            peer.on('connection', (conn) => {
                // ゲストからの接続を受け入れた時
                dataConnection = conn;
                setupDataConnection();
            });
            
            peer.on('error', (err) => {
                statusText.innerText = "エラーが発生しました: " + err.type;
                console.error(err);
            });
        }

        function joinRoom(hostId) {
            isHost = false;
            peer = new Peer();

            peer.on('open', () => {
                dataConnection = peer.connect(hostId, { reliable: true });
                setupDataConnection();
            });

            peer.on('error', (err) => {
                statusText.innerText = "接続エラー: " + err.type;
                console.error(err);
                document.getElementById('hostUI').classList.remove('hidden');
            });
        }

        function setupDataConnection() {
            dataConnection.on('open', () => {
                console.log("DataConnection Open!");
                lobbyScreen.classList.add('hidden');
                battleScreen.classList.remove('hidden');
                startGame();
            });
            
            dataConnection.on('close', () => {
                showResult("通信切断", false);
            });

            dataConnection.on('data', (data) => {
                if (typeof data === 'string') {
                    try { data = JSON.parse(data); } catch(e){}
                }
                
                if (data.type === 'state') {
                    enemyBoard = data.board;
                    enemyActive = data.active;
                    enemyState = data.state;
                    if (data.ojama !== undefined) {
                        document.getElementById('enemyOjamaDisplay').innerText = data.ojama;
                    }
                } else if (data.type === 'ojama') {
                    myOjamaQueue += data.amount;
                    document.getElementById('myOjamaDisplay').innerText = myOjamaQueue;
                } else if (data.type === 'gameover') {
                    gameState = 'GAMEOVER';
                    showResult("YOU WIN!", true);
                }
            });
        }

        function broadcastState() {
            if (dataConnection && dataConnection.open) {
                dataConnection.send(JSON.stringify({
                    type: 'state',
                    board: board,
                    active: activePuyo,
                    state: gameState,
                    ojama: myOjamaQueue
                }));
            }
        }
        function sendOjama(amount) {
            if (dataConnection && dataConnection.open) {
                dataConnection.send(JSON.stringify({ type: 'ojama', amount: amount }));
            }
        }
        function sendGameOver() {
            if (dataConnection && dataConnection.open) {
                dataConnection.send(JSON.stringify({ type: 'gameover' }));
            }
        }

        const COLS = 6;
        const ROWS = 13; // y=0 は生成用
        const BLOCK_SIZE = 30; // プレイヤー用
        const ENEMY_BLOCK_SIZE = 20; // 相手用

        const myCanvas = document.getElementById('gameCanvas');
        const myCtx = myCanvas.getContext('2d');
        const enCanvas = document.getElementById('enemyCanvas');
        const enCtx = enCanvas.getContext('2d');
        const nextCanvas = document.getElementById('nextCanvas');
        const nextCtx = nextCanvas.getContext('2d');

        const PUYO_COLORS = {
            1: { inner: '#ff9999', outer: '#e60000' }, // 赤
            2: { inner: '#9999ff', outer: '#0000e6' }, // 青
            3: { inner: '#99ff99', outer: '#00cc00' }, // 緑
            4: { inner: '#ffff99', outer: '#cccc00' }, // 黄
            5: { inner: '#e5e7eb', outer: '#9ca3af' }  // おじゃま (灰)
        };

        // My State
        let board = [];
        let score = 0;
        let chainCount = 0;
        let nextPuyo = { c1: 0, c2: 0 };
        let activePuyo = { x: 0, y: 0, rot: 0, c1: 0, c2: 0 };
        let gameState = 'GAMEOVER'; // PLAYING, CLEARING, DROPPING, GAMEOVER
        let toClear = [];
        let myOjamaQueue = 0;
        
        // Enemy State
        let enemyBoard = Array.from({length:ROWS}, ()=>Array(COLS).fill(0));
        let enemyActive = null;
        let enemyState = 'PLAYING';
        let enemyOjamaQueue = 0; // 表示用

        // Timers
        let lastTime = 0;
        let dropTimer = 0;
        let clearTimer = 0;
        let dropStepTimer = 0;
        let syncTimer = 0;
        let isFastDrop = false;

        function getRandomColor() { return Math.floor(Math.random() * 4) + 1; }
        
        function getSubPuyoPos(x, y, rot) {
            switch(rot) {
                case 0: return { x: x, y: y - 1 };
                case 1: return { x: x + 1, y: y };
                case 2: return { x: x, y: y + 1 };
                case 3: return { x: x - 1, y: y };
            }
        }

        function canMove(x, y, rot) {
            if (x < 0 || x >= COLS || y >= ROWS) return false;
            if (y >= 0 && board[y][x] !== 0) return false;
            let sub = getSubPuyoPos(x, y, rot);
            if (sub.x < 0 || sub.x >= COLS || sub.y >= ROWS) return false;
            if (sub.y >= 0 && board[sub.y][sub.x] !== 0) return false;
            return true;
        }

        function tryRotate(dir) {
            let newRot = (activePuyo.rot + dir + 4) % 4;
            if (canMove(activePuyo.x, activePuyo.y, newRot)) activePuyo.rot = newRot;
            else if (canMove(activePuyo.x - 1, activePuyo.y, newRot)) { activePuyo.x--; activePuyo.rot = newRot; }
            else if (canMove(activePuyo.x + 1, activePuyo.y, newRot)) { activePuyo.x++; activePuyo.rot = newRot; }
            else if (canMove(activePuyo.x, activePuyo.y - 1, newRot)) { activePuyo.y--; activePuyo.rot = newRot; }
            broadcastState();
        }

        function lockPuyo() {
            if (activePuyo.y >= 0) board[activePuyo.y][activePuyo.x] = activePuyo.c1;
            let sub = getSubPuyoPos(activePuyo.x, activePuyo.y, activePuyo.rot);
            if (sub.y >= 0) board[sub.y][sub.x] = activePuyo.c2;
        }

        function moveDown() {
            if (canMove(activePuyo.x, activePuyo.y + 1, activePuyo.rot)) {
                activePuyo.y++;
            } else {
                lockPuyo();
                chainCount = 0;
                gameState = 'DROPPING';
                dropStepTimer = 0;
            }
        }

        function applyGravityStep() {
            let dropped = false;
            for (let y = ROWS - 2; y >= 0; y--) {
                for (let x = 0; x < COLS; x++) {
                    if (board[y][x] !== 0 && board[y + 1][x] === 0) {
                        board[y + 1][x] = board[y][x];
                        board[y][x] = 0;
                        dropped = true;
                    }
                }
            }
            return dropped;
        }

        function checkMatches() {
            let visited = Array.from({ length: ROWS }, () => Array(COLS).fill(false));
            let matches = [];

            for (let y = 0; y < ROWS; y++) {
                for (let x = 0; x < COLS; x++) {
                    if (board[y][x] !== 0 && board[y][x] !== 5 && !visited[y][x]) { // 5はおじゃまなので起点にしない
                        let color = board[y][x];
                        let group = [];
                        let stack = [{ x, y }];
                        visited[y][x] = true;

                        while (stack.length > 0) {
                            let p = stack.pop();
                            group.push(p);
                            const dirs = [[0, 1], [0, -1], [1, 0], [-1, 0]];
                            for (let d of dirs) {
                                let nx = p.x + d[0], ny = p.y + d[1];
                                if (nx >= 0 && nx < COLS && ny >= 0 && ny < ROWS) {
                                    if (!visited[ny][nx] && board[ny][nx] === color) {
                                        visited[ny][nx] = true;
                                        stack.push({ x: nx, y: ny });
                                    }
                                }
                            }
                        }
                        if (group.length >= 4) matches = matches.concat(group);
                    }
                }
            }

            // おじゃまぷよの巻き込み判定
            if (matches.length > 0) {
                let toEraseGrid = Array.from({length:ROWS}, ()=>Array(COLS).fill(false));
                matches.forEach(p => toEraseGrid[p.y][p.x] = true);
                
                let ojamaMatches = [];
                matches.forEach(p => {
                    const dirs = [[0, 1], [0, -1], [1, 0], [-1, 0]];
                    for (let d of dirs) {
                        let nx = p.x + d[0], ny = p.y + d[1];
                        if (nx >= 0 && nx < COLS && ny >= 0 && ny < ROWS) {
                            if (board[ny][nx] === 5 && !toEraseGrid[ny][nx]) {
                                toEraseGrid[ny][nx] = true;
                                ojamaMatches.push({x: nx, y: ny});
                            }
                        }
                    }
                });
                matches = matches.concat(ojamaMatches);
            }
            return matches;
        }

        function calculateOjama(erasedCount, chain) {
            const chainBonus = [0, 8, 16, 32, 64, 96, 128, 160, 192, 224, 256];
            let bonus = chainBonus[chain - 1] || 256;
            if (chain === 1) bonus = 1;
            let pts = erasedCount * 10 * bonus;
            return Math.floor(pts / 120); // 120点で1個おじゃま
        }

        function spawnPuyo() {
            // おじゃまぷよの落下処理
            if (myOjamaQueue > 0) {
                let dropAmount = Math.min(myOjamaQueue, 30); // 1回の最大降下数(5段)
                myOjamaQueue -= dropAmount;
                document.getElementById('myOjamaDisplay').innerText = myOjamaQueue;
                
                // 上の方の空いているマスに配置
                let remaining = dropAmount;
                for(let row = 0; row < 5; row++) {
                    if (remaining <= 0) break;
                    let cols = [0,1,2,3,4,5].sort(()=>Math.random()-0.5); // ランダムな列順
                    for(let c of cols) {
                        if(board[row][c] === 0) {
                            board[row][c] = 5;
                            remaining--;
                            if(remaining<=0) break;
                        }
                    }
                }
                gameState = 'DROPPING';
                dropStepTimer = 0;
                return; // 落下が終わってから次をツモる
            }

            activePuyo = { x: 2, y: 1, rot: 0, c1: nextPuyo.c1, c2: nextPuyo.c2 };
            nextPuyo = { c1: getRandomColor(), c2: getRandomColor() };
            drawNext();
            
            if (!canMove(activePuyo.x, activePuyo.y, activePuyo.rot)) {
                gameState = 'GAMEOVER';
                sendGameOver();
                showResult("YOU LOSE...", false);
            } else {
                gameState = 'PLAYING';
            }
            broadcastState();
        }

        function drawPuyo(ctx, x, y, colorCode, size) {
            if (!PUYO_COLORS[colorCode]) return;
            let radius = size / 2;
            let cx = x + radius, cy = y + radius;
            let cObj = PUYO_COLORS[colorCode];

            let grad = ctx.createRadialGradient(cx - radius*0.3, cy - radius*0.3, radius*0.1, cx, cy, radius);
            grad.addColorStop(0, cObj.inner); grad.addColorStop(1, cObj.outer);

            ctx.beginPath(); ctx.arc(cx, cy, radius * 0.9, 0, Math.PI * 2);
            ctx.fillStyle = grad; ctx.fill(); ctx.closePath();
            
            ctx.beginPath(); ctx.arc(cx - radius*0.3, cy - radius*0.3, radius*0.15, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255, 255, 255, 0.5)'; ctx.fill(); ctx.closePath();

            if (colorCode !== 5) { // おじゃまぷよには目玉なし
                ctx.fillStyle = 'white';
                ctx.beginPath(); ctx.arc(cx - radius*0.2, cy, radius*0.2, 0, Math.PI*2); ctx.arc(cx + radius*0.2, cy, radius*0.2, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = 'black';
                ctx.beginPath(); ctx.arc(cx - radius*0.2, cy, radius*0.1, 0, Math.PI*2); ctx.arc(cx + radius*0.2, cy, radius*0.1, 0, Math.PI*2); ctx.fill();
            }
        }

        function drawBoard(ctx, b, active, state, clearingList, blockSize) {
            ctx.clearRect(0, 0, COLS * blockSize, ROWS * blockSize);
            
            // Grid
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
            ctx.lineWidth = 1;
            for(let i=0; i<=COLS; i++) { ctx.beginPath(); ctx.moveTo(i*blockSize, 0); ctx.lineTo(i*blockSize, ROWS*blockSize); ctx.stroke(); }
            for(let i=0; i<=ROWS; i++) { ctx.beginPath(); ctx.moveTo(0, i*blockSize); ctx.lineTo(COLS*blockSize, i*blockSize); ctx.stroke(); }

            // Danger Mark
            ctx.strokeStyle = 'rgba(255, 0, 0, 0.3)'; ctx.lineWidth = 2;
            let markX = 2 * blockSize, markY = 1 * blockSize;
            ctx.strokeRect(markX+4, markY+4, blockSize-8, blockSize-8);

            // Puyo
            for (let y = 0; y < ROWS; y++) {
                for (let x = 0; x < COLS; x++) {
                    if (b[y][x] !== 0) drawPuyo(ctx, x*blockSize, y*blockSize, b[y][x], blockSize);
                }
            }

            // Clearing Animation
            if (state === 'CLEARING' && clearingList) {
                let isFlash = Math.floor(clearTimer / 100) % 2 === 0;
                if (isFlash) {
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
                    clearingList.forEach(p => ctx.fillRect(p.x*blockSize, p.y*blockSize, blockSize, blockSize));
                }
            }

            // Active Puyo
            if (state === 'PLAYING' && active) {
                if(active.y >= 0) drawPuyo(ctx, active.x*blockSize, active.y*blockSize, active.c1, blockSize);
                let sub = getSubPuyoPos(active.x, active.y, active.rot);
                if(sub.y >= 0) drawPuyo(ctx, sub.x*blockSize, sub.y*blockSize, active.c2, blockSize);
            }
        }

        function drawNext() {
            nextCtx.clearRect(0, 0, nextCanvas.width, nextCanvas.height);
            let bs = 24, x = (nextCanvas.width - bs) / 2;
            drawPuyo(nextCtx, x, 5, nextPuyo.c2, bs);
            drawPuyo(nextCtx, x, 5 + bs, nextPuyo.c1, bs);
        }

        function update(deltaTime) {
            if (gameState === 'GAMEOVER') return;

            // Sync with opponent periodically
            syncTimer += deltaTime;
            if (syncTimer > 200) {
                broadcastState();
                syncTimer = 0;
            }

            if (gameState === 'PLAYING') {
                dropTimer += deltaTime;
                let speed = isFastDrop ? 50 : 800;
                if (dropTimer >= speed) {
                    moveDown();
                    dropTimer = 0;
                }
            } 
            else if (gameState === 'CLEARING') {
                clearTimer += deltaTime;
                if (clearTimer >= 700) {
                    toClear.forEach(p => board[p.y][p.x] = 0);
                    
                    // おじゃまぷよ生成と相殺
                    let generatedOjama = calculateOjama(toClear.length, chainCount);
                    score += toClear.length * 10 * chainCount; // 簡易スコア表示用
                    document.getElementById('scoreDisplay').innerText = score;

                    if (generatedOjama > 0) {
                        if (myOjamaQueue > 0) {
                            if (generatedOjama >= myOjamaQueue) {
                                generatedOjama -= myOjamaQueue;
                                myOjamaQueue = 0;
                            } else {
                                myOjamaQueue -= generatedOjama;
                                generatedOjama = 0;
                            }
                            document.getElementById('myOjamaDisplay').innerText = myOjamaQueue;
                        }
                        if (generatedOjama > 0) sendOjama(generatedOjama);
                    }
                    
                    gameState = 'DROPPING';
                    dropStepTimer = 0;
                }
            } 
            else if (gameState === 'DROPPING') {
                dropStepTimer += deltaTime;
                if (dropStepTimer >= 80) {
                    let dropped = applyGravityStep();
                    if (!dropped) {
                        toClear = checkMatches();
                        if (toClear.length > 0) {
                            chainCount++;
                            showChainText(chainCount);
                            gameState = 'CLEARING';
                            clearTimer = 0;
                        } else {
                            spawnPuyo();
                        }
                    }
                    dropStepTimer = 0;
                }
            }
        }

        function showChainText(chain) {
            if(chain <= 1) return;
            const cd = document.getElementById('chainDisplay');
            cd.innerText = `${chain} CHAIN!`;
            cd.style.opacity = '1';
            cd.style.transform = 'translateY(0)';
            setTimeout(() => {
                cd.style.opacity = '0';
                cd.style.transform = 'translateY(-20px)';
            }, 1000);
        }

        function showResult(text, isWin) {
            resultTitle.innerText = text;
            resultTitle.className = 'result-title ' + (isWin ? 'win-text' : 'lose-text');
            resultScreen.classList.remove('hidden');
        }

        returnLobbyBtn.addEventListener('click', () => {
            window.location.reload(); // 最も確実なリセット
        });

        function gameLoop(timestamp) {
            let deltaTime = timestamp - lastTime;
            lastTime = timestamp;

            update(deltaTime);
            
            // Draw Player
            drawBoard(myCtx, board, activePuyo, gameState, toClear, BLOCK_SIZE);
            // Draw Enemy
            drawBoard(enCtx, enemyBoard, enemyActive, enemyState, null, ENEMY_BLOCK_SIZE);

            requestAnimationFrame(gameLoop);
        }

        function setupButton(id, action, isDownBtn = false) {
            const btn = document.getElementById(id);
            if (!btn) return;
            
            if (isDownBtn) {
                const downStart = (e) => { if(e.cancelable) e.preventDefault(); if (gameState === 'PLAYING') isFastDrop = true; };
                const downEnd = (e) => { if(e.cancelable) e.preventDefault(); isFastDrop = false; };
                btn.addEventListener('mousedown', downStart); btn.addEventListener('touchstart', downStart, {passive: false});
                btn.addEventListener('mouseup', downEnd); btn.addEventListener('mouseleave', downEnd); btn.addEventListener('touchend', downEnd);
            } else {
                const handler = (e) => {
                    if(e.cancelable) e.preventDefault();
                    if (gameState === 'PLAYING') { action(); broadcastState(); }
                };
                btn.addEventListener('mousedown', handler);
                btn.addEventListener('touchstart', handler, { passive: false });
            }
        }

        setupButton('btnLeft', () => { if (canMove(activePuyo.x - 1, activePuyo.y, activePuyo.rot)) activePuyo.x--; });
        setupButton('btnRight', () => { if (canMove(activePuyo.x + 1, activePuyo.y, activePuyo.rot)) activePuyo.x++; });
        setupButton('btnLeftRot', () => tryRotate(-1));
        setupButton('btnRightRot', () => tryRotate(1));
        setupButton('btnDown', null, true);

        document.addEventListener('keydown', (e) => {
            if (gameState !== 'PLAYING') return;
            switch (e.code) {
                case 'ArrowLeft': if (canMove(activePuyo.x - 1, activePuyo.y, activePuyo.rot)) activePuyo.x--; break;
                case 'ArrowRight': if (canMove(activePuyo.x + 1, activePuyo.y, activePuyo.rot)) activePuyo.x++; break;
                case 'ArrowDown': isFastDrop = true; break;
                case 'ArrowUp': case 'KeyX': tryRotate(1); break;
                case 'KeyZ': tryRotate(-1); break;
            }
            broadcastState();
        });
        document.addEventListener('keyup', (e) => { if (e.code === 'ArrowDown') isFastDrop = false; });

        function startGame() {
            board = Array.from({ length: ROWS }, () => Array(COLS).fill(0));
            enemyBoard = Array.from({ length: ROWS }, () => Array(COLS).fill(0));
            score = 0; chainCount = 0; myOjamaQueue = 0;
            document.getElementById('scoreDisplay').innerText = '0';
            document.getElementById('myOjamaDisplay').innerText = '0';
            
            nextPuyo = { c1: getRandomColor(), c2: getRandomColor() };
            spawnPuyo();
            
            lastTime = performance.now();
            requestAnimationFrame(gameLoop);
        }

    </script>
</body>
</html>
